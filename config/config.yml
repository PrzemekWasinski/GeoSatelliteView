#How often do you want images to be compiled (Can select multiple):
#If you select multiple (for example hourly and daily) and the progam starts at 4pm, a timelapse will be made
#for 4pm-5pm and for 4pm-4pm (next day) so 2 timelapses. After this if you have selected `Sequential` or `Random`
#as the satellite configuration, the program will switch the satellite configuration after the longest timelapse
#has been made (in this case it would be daily).
Hourly: True
Daily: False
Weekly: False
Monthly: False

#How often do you want images to be pulled (Minutes):
Interval: 10

#Choose a satellite configuration:
#Random - picks a random configuration from config/satellites.h after each longest-interval timelapse
#Sequential - steps through config/satellites.h in order after each longest-interval timelapse
#[GOES18, PNW, AirMass] - always use a certain configuration (change the 3 values inside the brakcets)
Satellite: Sequential

#Delete ALL images after creating timelapse? (will exclude images kept by KeepInterval on line 25)
Delete: True

#How often do you want images to be kept? If the value is 6 then during a 24h timelapse 1 image will be kept every 
#6 hours. (This will still work even if Delete: True on line 21)
KeepInterval: 6

#Lets say you run this program at 2am and it stops at 5am. When you re-run it at 11am
#do you want to keep using imagery from 2am-5am (True) or do you want to discard it and start over (False).
UseIncompleteImages: False

#Path to the directory where the data folder will be created,
#e.g. `/home/user/projects/` will create a `data` dir and store everything in `/home/user/projects/data/`.
#Use `.` to store images in the project dir.
DataPath: ./

#Output format for timelapse videos:
#AVI   - Motion JPEG (.avi)  - universally compatible, large files
#MP4   - MPEG-4 (.mp4)       - widely supported, good compression
#MKV   - MPEG-4 in Matroska (.mkv) - flexible container, good for archiving
#WEBM  - VP8 (.webm)         - open format, browser/web-friendly
#H264  - H.264 (.mp4)        - best compression, requires H.264 encoder
Format: MP4

#You will have to re-run the program after modifying this config file!