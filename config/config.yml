#How often do you want images compiled (you can select multiple):
#Every configured satellite source gets its own timelapse for every enabled period.
#For example: Enabling Daily and Hourly will create timelapses every 1h and 24h.
Hourly: True
Daily: True
ThreeDaily: False
Weekly: False
Monthly: False

#How often do you want images to be pulled (Minutes):
#Every entry in config/satellites.h is pulled once per interval.
Interval: 10

#Maximum number of timelapses encoded simultaneously. Three is recommended for
#a Raspberry Pi 4; additional videos wait in a queue.
EncoderWorkers: 3

#Stop collecting before the data disk has less than this much free space.
MinimumDiskGB: 10

#Copy the first capture in each UTC-aligned N-hour slot from temp/ to permanent imagery.
#Zero disables periodic copies. Temporary files are always cleared at startup
#and completed period folders are always deleted after the video is copied.
KeepInterval: 6

#Path to the directory where the data folder will be created,
#e.g. `/home/user/projects/` will create a `Data` dir and store everything in `/home/user/projects/Data/`.
#Use `.` to store images in the project dir. A path ending in `Data` or `data` is used directly.
DataPath: .

#Output format for timelapse videos:
#AVI   - Motion JPEG (.avi)  - universally compatible, large files
#MP4   - MPEG-4 (.mp4)       - widely supported, good compression
#MKV   - MPEG-4 in Matroska (.mkv) - flexible container, good for archiving
#WEBM  - VP8 (.webm)         - open format, browser/web-friendly
#H264  - H.264 (.mp4)        - best compression, requires H.264 encoder
Format: MP4

#You will have to re-run the program after modifying this config file!